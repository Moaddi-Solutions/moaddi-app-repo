/purchases:
  post:
    tags: [Purchases]
    summary: Create a new purchase
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PurchaseCreateBody"
    responses:
      "201":
        description: Purchase created
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PurchaseCreateResponse"
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "401":
        description: Unauthorized

/purchases/customerHistory/{customerId}:
  get:
    tags: [Purchases]
    summary: Customer purchase history
    description: The customer themself, or Admin. Paginated with `offset`/`skip` and `limit` (max 1000).
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
      - in: query
        name: skip
        description: Same as offset
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
          default: 100
          maximum: 1000
    responses:
      "200":
        description: Paginated purchases with products
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                total:
                  type: integer
      "401":
        description: Unauthorized
      "403":
        description: Forbidden

/purchases/allpendingrequests:
  get:
    tags: [Purchases]
    summary: List purchases awaiting accept/reject (direct machines only)
    description: |
      Admin and Vendor only. Rows are filtered to **direct** machines (`type === 0`);
      `total` matches the filtered list (up to 10k recent matches before filter).
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          default: 1000
    responses:
      "200":
        description: Pending list
        content:
          application/json:
            schema:
              type: object
      "401":
        description: Unauthorized
      "403":
        description: Forbidden (not Admin or Vendor)

/purchases/reset/{customerId}:
  delete:
    tags: [Purchases]
    summary: Delete all incomplete purchases for a customer
    description: The authenticated customer (or Admin) only. Prefer this over the deprecated GET variant.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Reset result
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
  get:
    tags: [Purchases]
    summary: (Deprecated) Same as DELETE — use DELETE instead
    deprecated: true
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Reset result
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
