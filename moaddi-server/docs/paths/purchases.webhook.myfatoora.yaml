/purchases/webhook/myfatoora:
  post:
    tags: [Webhooks – My Fatoora]
    summary: My Fatoorah Webhook v2 (PAYMENT_STATUS_CHANGED)
    description: |
      Invoked by My Fatoorah when payment status changes. HMAC in header
      `myfatoorah-signature` (or `MyFatoorah-Signature`) when
      `MYFATORA_WEBHOOK_SECRET` is set. Raw JSON body.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: |
              See My Fatoorah webhook docs. Event `Code` 1 with `Data.Invoice` / `Data.Transaction`.
    responses:
      "200":
        description: |
          `received: true` when processed, or `ignored` / `skipped` when the event
          is acknowledged but not actioned.
        content:
          application/json:
            schema:
              type: object
      "400":
        description: Invalid JSON or missing invoice id
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "401":
        description: Signature verification failed when secret is configured
